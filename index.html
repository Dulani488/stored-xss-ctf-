<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stored XSS - Malicious Memory</title>
</head>
<body>
  <h1>Blog Post</h1>
  <p>This is a comment section where you can leave feedback.</p>

  <h2>Leave a Comment:</h2>
  <form id="commentForm">
    <textarea id="comment" rows="4" cols="50" placeholder="Leave your comment"></textarea><br>
    <button type="submit">Submit Comment</button>
  </form>

  <div id="commentsSection">
    <h3>Comments</h3>
  </div>

  <script>
    // Store the comment on form submit
    document.getElementById("commentForm").onsubmit = function(e) {
      e.preventDefault();
      const comment = document.getElementById("comment").value;
      localStorage.setItem("comment", comment);
      location.reload();
    };

    // Simulate Admin session cookie
    document.cookie = "AdminSession=abc123";

    // Display stored comment
    const storedComment = localStorage.getItem("comment");
    if (storedComment) {
      document.getElementById("commentsSection").innerHTML += `<p>${storedComment}</p>`;
      
      // Execute payload if <script> present
      if (storedComment.includes("<script>")) {
        // Simulate exfiltration to /flag
        const stolenCookie = document.cookie;
        // Add cookie to URL so we can simulate "flag" display
        window.location.href = window.location.pathname + "?cookie=" + encodeURIComponent(stolenCookie);
      }
    }

    // Simulate server-side flag retrieval
    const params = new URLSearchParams(window.location.search);
    if (params.get("cookie") === "AdminSession=abc123") {
      alert("Flag: THM{stored_xss_steals_sessions}");
    }
  </script>
</body>
</html>
